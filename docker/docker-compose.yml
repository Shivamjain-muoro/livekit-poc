version: '3.8'
services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    ports:
      - "7880:7880"    # WebSocket port
      - "7881:7881"    # TCP port for ICE
      - "7882:7882/udp" # UDP port range start
    environment:
      - "LIVEKIT_KEYS=devkey: secret"
      - "LIVEKIT_REDIS_HOST=livekit-redis:6379"
      - "LIVEKIT_ROOM_AUTO_CREATE=true"
      - "LIVEKIT_LOG_LEVEL=info"
      - "LIVEKIT_DEVELOPMENT=true"
    command: --bind 0.0.0.0
    restart: unless-stopped
    networks:
      - livekit-network

  redis:
    image: redis:alpine
    container_name: livekit-redis
    ports:
      - "6379:6379"
    networks:
      - livekit-network
    restart: unless-stopped

networks:
  livekit-network:
    driver: bridge
