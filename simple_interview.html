<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview System - Simple Test Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            background: #667eea;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .interview-section {
            display: none;
            margin-top: 30px;
        }
        
        .question-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .answer-box {
            margin-bottom: 20px;
        }
        
        .answer-box textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            min-height: 120px;
            resize: vertical;
        }
        
        .controls {
            text-align: center;
            gap: 15px;
            display: flex;
            justify-content: center;
        }
        
        .debug-panel {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .feedback-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .speaking-controls {
            margin: 20px 0;
            text-align: center;
        }
        
        .recording-indicator {
            color: red;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 AI Interview System</h1>
            <p>Simple Test Version - No LiveKit Required</p>
        </div>

        <!-- Setup Form -->
        <div id="setupForm">
            <h2>Start Your Interview</h2>
            <p style="margin-bottom: 30px; color: #666;">Fill in your details to begin the interview.</p>
            
            <div class="form-group">
                <label for="candidateName">Full Name</label>
                <input type="text" id="candidateName" value="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="candidateEmail">Email Address</label>
                <input type="email" id="candidateEmail" value="john.doe@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="position">Position Applied For</label>
                <input type="text" id="position" value="Senior Software Engineer" required>
            </div>
            
            <div class="form-group">
                <label for="experienceLevel">Experience Level</label>
                <select id="experienceLevel" required>
                    <option value="">Select your experience level</option>
                    <option value="entry">Entry Level (0-2 years)</option>
                    <option value="mid">Mid Level (3-5 years)</option>
                    <option value="senior" selected>Senior Level (5-8 years)</option>
                    <option value="lead">Lead/Principal (8+ years)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="skills">Key Skills (comma separated)</label>
                <input type="text" id="skills" value="Python, JavaScript, System Design">
            </div>
            
            <div class="controls">
                <button class="btn" onclick="startSimpleInterview()">Start Interview</button>
            </div>
        </div>

        <!-- Interview Section -->
        <div class="interview-section" id="interviewSection">
            <div class="question-box" id="questionBox">
                <h3>Question <span id="questionNumber">1</span></h3>
                <p id="questionText">Loading question...</p>
                <div style="margin-top: 10px; font-size: 14px; color: #666;">
                    <span>Type: <strong id="questionType">-</strong></span> | 
                    <span>Difficulty: <strong id="questionDifficulty">-</strong>/5</span>
                </div>
            </div>
            
            <div class="speaking-controls">
                <button class="btn" id="speakQuestionBtn" onclick="speakQuestion()">🔊 Speak Question</button>
                <button class="btn" id="startRecordingBtn" onclick="startRecording()" style="margin-left: 10px;">🎤 Start Recording</button>
                <button class="btn" id="stopRecordingBtn" onclick="stopRecording()" style="display: none; margin-left: 10px;">⏹️ Stop Recording</button>
                <div id="recordingStatus" style="margin-top: 10px;"></div>
            </div>
            
            <div class="answer-box">
                <label for="answerText"><strong>Your Answer:</strong></label>
                <textarea id="answerText" placeholder="Type your answer here or use speech recognition..."></textarea>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="submitAnswer()">Submit Answer</button>
                <button class="btn" onclick="endInterview()" style="background: #dc3545;">End Interview</button>
            </div>
        </div>

        <!-- Feedback Section -->
        <div class="feedback-section" id="feedbackSection">
            <h2>🎉 Interview Complete!</h2>
            <div id="feedbackContent">
                <p>Loading feedback...</p>
            </div>
            <div class="controls" style="margin-top: 20px;">
                <button class="btn" onclick="startNewInterview()">Start New Interview</button>
            </div>
        </div>

        <!-- Debug Panel -->
        <div class="debug-panel">
            <strong>Debug Log:</strong><br>
            <div id="debugLog"></div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let currentQuestion = null;
        let questionIndex = 0;
        let questions = [];
        let answers = [];
        let speechSynthesis = window.speechSynthesis;
        let recognition = null;
        let isRecording = false;

        function debugLog(message) {
            const debugDiv = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(message);
        }

        // Initialize speech recognition
        function initializeSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) {
                            transcript += event.results[i][0].transcript + ' ';
                        }
                    }
                    if (transcript) {
                        const currentText = document.getElementById('answerText').value;
                        document.getElementById('answerText').value = currentText + transcript;
                        debugLog(`Speech recognized: ${transcript.trim()}`);
                    }
                };

                recognition.onerror = function(event) {
                    debugLog(`Speech recognition error: ${event.error}`);
                    isRecording = false;
                    updateRecordingUI();
                };

                recognition.onend = function() {
                    isRecording = false;
                    updateRecordingUI();
                    debugLog('Speech recognition ended');
                };

                debugLog('Speech recognition initialized');
                return true;
            } else {
                debugLog('Speech recognition not supported in this browser');
                return false;
            }
        }

        async function startSimpleInterview() {
            try {
                debugLog('Starting simple interview...');
                
                // Get form data
                const name = document.getElementById('candidateName').value.trim();
                const email = document.getElementById('candidateEmail').value.trim();
                const position = document.getElementById('position').value.trim();
                const experienceLevel = document.getElementById('experienceLevel').value;
                const skills = document.getElementById('skills').value.split(',').map(s => s.trim()).filter(s => s);

                if (!name || !email || !position || !experienceLevel) {
                    alert('Please fill in all required fields.');
                    return;
                }

                // Create session
                const sessionData = {
                    candidate: {
                        name,
                        email,
                        position,
                        experience_level: experienceLevel,
                        skills
                    },
                    interview_type: "technical"
                };

                debugLog('Creating interview session...');
                const response = await fetch('/api/interview/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sessionData)
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    throw new Error(`Failed to create session: ${errorData}`);
                }

                const session = await response.json();
                sessionId = session.session_id;
                debugLog(`Session created: ${sessionId}`);

                // Initialize speech features
                initializeSpeechRecognition();

                // Start interview
                await startQuestions();

                // Show interview section
                document.getElementById('setupForm').style.display = 'none';
                document.getElementById('interviewSection').style.display = 'block';

            } catch (error) {
                console.error('Error starting interview:', error);
                debugLog(`Error: ${error.message}`);
                alert('Error starting interview: ' + error.message);
            }
        }

        async function startQuestions() {
            try {
                debugLog('Starting interview questions...');
                
                const response = await fetch(`/api/interview/start/${sessionId}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Failed to start interview: ${errorText}`);
                }

                const result = await response.json();
                currentQuestion = result.question;
                questionIndex = 1;

                debugLog(`First question received: ${currentQuestion.question_text}`);
                displayQuestion(currentQuestion);

            } catch (error) {
                console.error('Error starting questions:', error);
                debugLog(`Error starting questions: ${error.message}`);
                alert('Error loading questions: ' + error.message);
            }
        }

        function displayQuestion(question) {
            document.getElementById('questionNumber').textContent = questionIndex;
            document.getElementById('questionText').textContent = question.question_text;
            document.getElementById('questionType').textContent = question.question_type;
            document.getElementById('questionDifficulty').textContent = question.difficulty_level;
            document.getElementById('answerText').value = '';
            
            debugLog(`Displaying question ${questionIndex}: ${question.question_text}`);
        }

        function speakQuestion() {
            if (speechSynthesis && currentQuestion) {
                speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(currentQuestion.question_text);
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 0.8;
                
                const voices = speechSynthesis.getVoices();
                const preferredVoice = voices.find(voice => 
                    voice.lang.includes('en') && voice.name.includes('Female')
                ) || voices.find(voice => voice.lang.includes('en'));
                
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                utterance.onstart = () => {
                    debugLog('AI speaking question...');
                    document.getElementById('speakQuestionBtn').textContent = '🗣️ Speaking...';
                };

                utterance.onend = () => {
                    debugLog('AI finished speaking');
                    document.getElementById('speakQuestionBtn').textContent = '🔊 Speak Question';
                };

                speechSynthesis.speak(utterance);
            }
        }

        function startRecording() {
            if (recognition && !isRecording) {
                isRecording = true;
                recognition.start();
                updateRecordingUI();
                debugLog('Started speech recognition');
            }
        }

        function stopRecording() {
            if (recognition && isRecording) {
                recognition.stop();
                isRecording = false;
                updateRecordingUI();
                debugLog('Stopped speech recognition');
            }
        }

        function updateRecordingUI() {
            const startBtn = document.getElementById('startRecordingBtn');
            const stopBtn = document.getElementById('stopRecordingBtn');
            const status = document.getElementById('recordingStatus');

            if (isRecording) {
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
                status.innerHTML = '<span class="recording-indicator">🔴 Recording... Speak your answer</span>';
            } else {
                startBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
                status.innerHTML = '';
            }
        }

        async function submitAnswer() {
            try {
                const answerText = document.getElementById('answerText').value.trim();
                
                if (!answerText) {
                    alert('Please provide an answer before submitting.');
                    return;
                }

                debugLog(`Submitting answer: ${answerText.substring(0, 100)}...`);

                const response = await fetch(`/api/interview/answer/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        answer_text: answerText,
                        duration: 60
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Failed to submit answer: ${errorText}`);
                }

                const result = await response.json();
                debugLog('Answer submitted successfully');

                if (result.next_question) {
                    currentQuestion = result.next_question;
                    questionIndex++;
                    displayQuestion(currentQuestion);
                    debugLog(`Moving to question ${questionIndex}`);
                } else {
                    debugLog('Interview completed, showing feedback');
                    await showFeedback();
                }

            } catch (error) {
                console.error('Error submitting answer:', error);
                debugLog(`Error submitting answer: ${error.message}`);
                alert('Error submitting answer: ' + error.message);
            }
        }

        async function showFeedback() {
            try {
                document.getElementById('interviewSection').style.display = 'none';
                document.getElementById('feedbackSection').style.display = 'block';

                debugLog('Loading feedback...');
                const response = await fetch(`/api/interview/summary/${sessionId}`);
                
                if (!response.ok) {
                    throw new Error('Failed to get feedback');
                }

                const summary = await response.json();
                debugLog('Feedback loaded successfully');

                const feedbackHTML = `
                    <h3>Overall Score: ${summary.overall_score?.toFixed(1) || 'N/A'}/5</h3>
                    <p><strong>Feedback:</strong></p>
                    <p>${summary.detailed_feedback || 'Feedback not available'}</p>
                    
                    ${summary.category_scores ? `
                        <h4>Category Scores:</h4>
                        <ul>
                            ${Object.entries(summary.category_scores).map(([category, score]) => 
                                `<li>${category.replace('_', ' ').toUpperCase()}: ${score.toFixed(1)}/5</li>`
                            ).join('')}
                        </ul>
                    ` : ''}
                    
                    ${summary.strengths ? `
                        <h4>Strengths:</h4>
                        <ul>${summary.strengths.map(strength => `<li>${strength}</li>`).join('')}</ul>
                    ` : ''}
                    
                    ${summary.areas_for_improvement ? `
                        <h4>Areas for Improvement:</h4>
                        <ul>${summary.areas_for_improvement.map(improvement => `<li>${improvement}</li>`).join('')}</ul>
                    ` : ''}
                `;

                document.getElementById('feedbackContent').innerHTML = feedbackHTML;

            } catch (error) {
                console.error('Error loading feedback:', error);
                debugLog(`Error loading feedback: ${error.message}`);
                document.getElementById('feedbackContent').innerHTML = 
                    '<p>Error loading feedback. Please contact support.</p>';
            }
        }

        function endInterview() {
            if (confirm('Are you sure you want to end the interview?')) {
                showFeedback();
            }
        }

        function startNewInterview() {
            window.location.reload();
        }

        // Initialize speech synthesis voices when page loads
        window.addEventListener('load', () => {
            if (speechSynthesis) {
                speechSynthesis.getVoices();
                debugLog('Speech synthesis initialized');
            }
        });

        // Handle speech synthesis voices loaded event
        if (speechSynthesis) {
            speechSynthesis.onvoiceschanged = () => {
                const voices = speechSynthesis.getVoices();
                debugLog(`Speech synthesis voices loaded: ${voices.length} voices available`);
            };
        }

        // Initial debug message
        debugLog('Simple interview system loaded successfully');
    </script>
</body>
</html>
